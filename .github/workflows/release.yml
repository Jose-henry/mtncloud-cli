# Publishes the mtncloud-cli gem to RubyGems.org when a version tag is pushed.
#
# Release a new version:
#   1. Bump VERSION in lib/mtncloud/cli/version.rb and push to main.
#   2. git tag v<version> && git push origin v<version>
#
# Uses RubyGems trusted publishing, so no API key is stored in this repository.
# RubyGems.org must list this repository, this workflow file (release.yml)
# and the "release" environment as a trusted publisher. See README > Releasing.
name: Publish gem

on:
  push:
    tags:
      - "v*"

jobs:
  push:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    environment: release

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: "3.3"

      - name: Check the tag matches the gem version
        run: |
          gem_version=$(ruby -Ilib -e 'require "mtncloud/cli/version"; print MtnCloud::Cli::VERSION')
          if [ "${GITHUB_REF_NAME}" != "v${gem_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the gem version ${gem_version} in lib/mtncloud/cli/version.rb"
            exit 1
          fi

      - uses: rubygems/release-gem@v1
